services:
  mongo:
    image: mongo:7
    container_name: healthwatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: healthwatch-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8081
      MONGODB_URI: mongodb://mongo:27017/HealthWatch
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    container_name: healthwatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  mongo-data:
